# ===== Gradle / AndroidX =====
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# ===== Android SDK =====
ANDROID_MIN_SDK_VERSION=24
ANDROID_TARGET_SDK_VERSION=35
ANDROID_COMPILE_SDK_VERSION=35
KOTLIN_VERSION=2.1.0

# ===== DJI App Key =====
# 在 https://developer.dji.com/user/apps/ 创建 Android App 后填入；必须与下面 applicationId + 签名证书 SHA256 绑定。
# 官方 sample 用 manifestPlaceholders["API_KEY"] 注入到 AndroidManifest 的 com.dji.sdk.API_KEY meta-data。
AIRCRAFT_API_KEY=Please_add_your_DJI_App_Key_here

# ===== 桥接层默认参数（可通过 BuildConfig 或 SharedPreferences 覆盖） =====
BRIDGE_HTTP_PORT=8765
BRIDGE_DEFAULT_MODE=real
