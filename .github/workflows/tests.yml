name: tests

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # GitHub Actions 的 Windows runner 默认 stdout 是 cp1252 管道，本项目输出含中文；
  # 不开 UTF-8 会触发 UnicodeEncodeError（验收脚本/服务端日志）。
  PYTHONUTF8: "1"

jobs:
  llm-drone-unit-tests:
    name: llm_drone unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run unit tests
        working-directory: llm_drone
        run: python -m unittest discover -s tests -v

  llm-drone-acceptance:
    name: llm_drone black-box acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run Lead acceptance harness (sim only, no LLM)
        run: python llm_drone/logs/lead/verify_acceptance.py --port 8766
        timeout-minutes: 10
